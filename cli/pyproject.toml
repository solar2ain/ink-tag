[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inktag-cli"
dynamic = ["version"]
description = "Cross-platform command-line client for InkTag e-paper devices"
readme = "README.md"
requires-python = ">=3.11"
license = "LicenseRef-InkTag-Private-Preview"
authors = [{ name = "InkTag contributors" }]
dependencies = [
  "bleak>=2.0,<4",
  "cryptography>=44,<51",
  "mini-racer>=0.12.4,<1",
  "Pillow>=10,<13",
  "qrcode>=8,<9",
  "rich>=13,<15",
  "typer>=0.16,<1",
]

[project.scripts]
inktag = "inktag_cli.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"inktag_cli._assets" = ["*.js", "*.cjs", "*.txt"]

[tool.setuptools.dynamic]
version = { attr = "inktag_cli._version.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
