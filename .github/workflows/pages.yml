name: Deploy InkTag Web
run-name: InkTag Pages ${{ inputs.request_id || github.run_id }}

on:
  workflow_dispatch:
    inputs:
      expected_commit:
        description: Exact reviewed main commit to deploy
        required: true
        type: string
      release_tag:
        description: Reviewed client Release tag
        required: true
        type: string
      request_id:
        description: Deployment request correlation ID
        required: true
        type: string
      accept_deferred_review:
        description: Use the exact recorded owner decision for outstanding licensing reviews
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - "webui/**"
      - "tools/verify-pages.py"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "webui/**"
      - "tools/verify-pages.py"
      - ".github/workflows/pages.yml"

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ inputs.expected_commit || github.sha }}
      - name: Verify exact manual-dispatch revision
        if: github.event_name == 'workflow_dispatch'
        env:
          EXPECTED: ${{ inputs.expected_commit }}
          TRIGGER_SHA: ${{ github.sha }}
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$EXPECTED" = "$TRIGGER_SHA"
          test "$(git rev-parse HEAD)" = "$EXPECTED"
      - name: Set up Node.js
        if: hashFiles('webui/package-lock.json') != ''
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: webui/package-lock.json
      - name: Install WebUI verification dependencies
        if: hashFiles('webui/package-lock.json') != ''
        working-directory: webui
        run: npm ci --no-audit --no-fund
      - name: Verify the checked-in release WebUI
        if: hashFiles('webui/package-lock.json') != '' && hashFiles('webui/dist/static/index.html') != ''
        working-directory: webui
        run: node tools/verify-builds.mjs
      - name: Build WebUI from source when dist is absent
        if: hashFiles('webui/package-lock.json') != '' && hashFiles('webui/dist/static/index.html') == ''
        working-directory: webui
        run: npm run build
      - name: Prepare the compiled site
        id: site
        run: |
          site=webui
          if [ -f webui/package-lock.json ]; then
            site=webui/dist/static
            for subdir in updates manual licenses; do
              if [ -d "webui/$subdir" ]; then
                cp -R "webui/$subdir" "$site/"
              fi
            done
            if [ -d "$site/licenses" ]; then
              cp "$site/LICENSING.txt" "$site/licenses/LICENSING.txt"
              cp "$site/THIRD_PARTY_NOTICES.txt" "$site/licenses/THIRD_PARTY_NOTICES.txt"
            fi
          fi
          echo "path=$site" >> "$GITHUB_OUTPUT"
          python3 tools/verify-pages.py --site "$site"
      - name: Require public review for a deployment
        if: github.event_name == 'workflow_dispatch' && inputs.accept_deferred_review != true
        run: python3 tools/verify-release.py --repo . --public --download-source-materials
      - name: Verify the explicit owner publication decision
        if: github.event_name == 'workflow_dispatch' && inputs.accept_deferred_review == true
        run: |
          python3 tools/verify-release.py --repo .
          python3 tools/verify-publication-decision.py --repo .
      - name: Bind deployment to the published client record
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          record=json.loads(Path('releases/record.json').read_text())
          matching=[r for r in record['releases'] if r['releaseTag']==os.environ['RELEASE_TAG'] and r['published'] and r['releaseReady'] and not r['candidateOnly']]
          if len(matching)!=1:
              raise SystemExit('Release publication is not attested by this commit')
          PY

      - name: Upload the reviewed compiled site
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ steps.site.outputs.path }}

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    needs: validate
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          ref: ${{ inputs.expected_commit }}
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
