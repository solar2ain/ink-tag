# Hanshow NebularPro-154Q-N
# Stock-derived ADC/RGB/NFC/display software pilot; physical tests remain open.
# Unified app-full.zip / layout-v1; first flash must retain full readback.
# PB0 ADC and PC0/PC1/PC6/PC4 NFC are immutable exact-PCB backend facts.
format_version = 1
board_marking = "HSEL4Q_01_54M_31"

[screen]
ic = "JD79XXX" # Family driver; exact controller die remains unconfirmed.
recipe = 2
color = "BWRY"
rotation = 90
mirror_x = true
mirror_y = false

native_ui_scale = 0 # 0=AUTO; 1=1x; 2=1.5x; 3=2x; 4=1.25x; 5=1.75x
width = 200
height = 200
visible_x = 0
visible_y = 0
visible_width = 200
visible_height = 200

[gpio.display]
mosi = "PB6"
clock = "PD7"
cs = "PD2"
dc = "PB7"
reset = "PD4"
busy = "PA1"
enable = "PB5"
enable_active_low = true

[gpio.led]
red = "PB4"
green = "PD3"
blue = "PA7"
active_low = ["red", "green", "blue"]
