# Hanshow Nowa-154R-N
# Unified app-full.zip / layout-v1; screen and LED defaults remain overridable.
# NFC, Flash, ADC and sleep policy follow the exact immutable PCB backend.
format_version = 1
board_marking = "HS_EL5101_5M_66_05"

[screen]
ic = "SSD1675"
recipe = 1
color = "BWR"
rotation = 90
mirror_x = true
mirror_y = false

native_ui_scale = 0 # 0=AUTO; 1=1x; 2=1.5x; 3=2x; 4=1.25x; 5=1.75x
width = 152
height = 152
visible_x = 0
visible_y = 0
visible_width = 152
visible_height = 152

[gpio.display]
mosi = "PB6"
clock = "PB5"
cs = "PB4"
dc = "PD7"
reset = "PD4"
busy = "PA1"
enable = "PB7"
enable_active_low = true

[gpio.led]
red = "PD2"
green = "PD3"
blue = "PA7"
active_low = ["red", "green", "blue"]
