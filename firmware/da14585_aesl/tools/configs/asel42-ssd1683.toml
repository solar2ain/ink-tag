# asel42 with the separately confirmed ZKC42VM / HINK-E042A13-FPC-A0 panel.
# Board selector and display wiring are unchanged; SSD1683 BUSY is active high.
format_version = 1
board_marking = "asel42"

[screen]
ic = "SSD1683"
recipe = 1
color = "BWR"
rotation = 0
mirror_x = false
mirror_y = false
native_ui_scale = 0
width = 400
height = 300
visible_x = 0
visible_y = 0
visible_width = 400
visible_height = 300

[gpio.display]
mosi = "P2.0"
clock = "P0.1"
cs = "P2.1"
dc = "P0.7"
reset = "P1.0"
busy = "P1.1"
bs = "P2.2"
enable = "P2.3"
enable_active_low = false
