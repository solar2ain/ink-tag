# PCB: ZK_EL_OM6626_2.13_V1.1; product: ZKC21V-N (OM6626, NFC).
# Human-confirmed marking on 2026-10-14; production note: PH2516.
# Uses existing numeric backend 3 and the shared om6626_zkc/app-full.zip.
# No local stock backup is required. Exact-board display/NFC/Full acceptance
# remains separate; geometry/transform below follow the existing OM descriptor.
format_version = 1
baseline = "inktag-release-v1"
board_marking = "ZK_EL_OM6626_2.13_V1.1"

[screen]
ic = "SSD1680"
recipe = 1
color = "BWR"
rotation = 90
mirror_x = false
mirror_y = true
native_ui_scale = 0
width = 128
height = 250
visible_x = 0
visible_y = 0
visible_width = 122
visible_height = 250

[gpio.display]
mosi = "GPIO21"
clock = "GPIO15"
cs = "GPIO22"
dc = "GPIO20"
reset = "GPIO16"
busy = "GPIO3"
enable = "GPIO7"
enable_active_low = false

[gpio.led]
red = "GPIO4"
green = "GPIO18"
blue = "GPIO17"
active_low = ["red", "green", "blue"]

[gpio.aux]
txd = "disabled"
rxd = "disabled"
active_low = []
